# Una sola vez: baja de comexius.com los archivos publicados (hoy servidos desde el KV)
# y los guarda en site/. Después de la primera corrida se puede borrar este archivo.
name: Importar sitio publicado
on:
  push:
    branches: [main]
    paths: [".github/workflows/importar-sitio.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar archivos
        run: |
          set -e
          for p in index.html en/index.html privacidad.html terminos.html gracias.html \
                   en/privacy.html en/terms.html en/thanks.html \
                   styles.css favicon.svg robots.txt sitemap.xml; do
            mkdir -p "site/$(dirname "$p")"
            code=$(curl -sS -A "comexius-web-import" -o "site/$p" -w "%{http_code}" "https://comexius.com/$p")
            echo "$p → $code ($(wc -c < "site/$p") bytes)"
            [ "$code" = "200" ] || { echo "falló $p"; exit 1; }
          done
      - name: Probar el empaquetado
        run: node scripts/build.mjs
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Importar sitio publicado desde comexius.com [skip ci]" || echo "sin cambios"
          git push
